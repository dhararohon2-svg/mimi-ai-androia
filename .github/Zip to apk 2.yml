name: Build APK from Catbox Zip

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Zip file download link'
        required: true
        default: 'https://files.catbox.moe/m0wm9l.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Download Zip File
      run: |
        curl -L -o project.zip "${{ github.event.inputs.zip_url }}"
        mkdir extracted_folder
        unzip -q project.zip -d extracted_folder

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find gradlew and Build APK
      run: |
        # এটি স্বয়ংক্রিয়ভাবে জিপের ভেতর থেকে gradlew ফাইলের সঠিক ফোল্ডার খুঁজে বের করবে
        GRADLEW_PATH=$(find extracted_folder -name "gradlew" -type f)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file not found in the zip!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project at: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/app/build/outputs/apk/debug/app-debug.apk"
        
