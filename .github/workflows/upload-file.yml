name: Upload Any File

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: 'আপলোড করার ফাইলের পাথ (যেমন: folder/filename.zip)'
        required: true
        default: 'app/build/outputs/apk/debug/app-debug.apk'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom-uploaded-file
        path: ${{ github.event.inputs.file_path }}
        
